name: api

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        working-directory: apps/api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/myshop
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          VIETQR_BANK_ID: MB
          VIETQR_ACCOUNT_NO: '0987654321'
          VIETQR_ACCOUNT_NAME: 'MYSHOP BOUTIQUE'
        run: ./mvnw --batch-mode verify
