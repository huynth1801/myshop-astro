spring:
  application:
    name: shop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myshop}
    username: ${DB_USERNAME:tgm-mac007}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

shop:
  cors:
    allowed-origins: http://localhost:4321
  cookie:
    secure: false # true in staging/prod behind HTTPS
  auth:
    # HS256 key must be >= 32 chars. Override in every real environment.
    jwt-secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-minutes: 15
    refresh-token-days: 7
