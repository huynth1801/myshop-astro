spring:
  application:
    name: shop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myshop}
    username: ${DB_USERNAME:tgm-mac007}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  web:
    cors:
      allowed-origins: http://localhost:4321

server:
  port: 8080
