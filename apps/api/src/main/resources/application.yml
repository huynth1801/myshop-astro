spring:
  application:
    name: shop-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:apps/api/.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 6MB # app rule is 5MB; slack for multipart overhead
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myshop}
    username: ${DB_USERNAME:tgm-mac007}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

shop:
  cors:
    # 127.0.0.1 matters: devs often browse the dev server via 127.0.0.1:4321.
    allowed-origins: http://localhost:4321,http://127.0.0.1:4321
  cookie:
    secure: false # true in staging/prod behind HTTPS
  uploads:
    # Product image uploads (ADR 0005) — swap for S3/Cloudinary before scale-out.
    dir: ${UPLOAD_DIR:./data/uploads}
  auth:
    # HS256 key must be >= 32 chars. Override in every real environment.
    jwt-secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-minutes: ${AUTH_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:7}

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:myshop <noreply@myshop.vn>}
  payment:
    vietqr:
      bank-id: ${VIETQR_BANK_ID:MB}
      account-no: ${VIETQR_ACCOUNT_NO:0987654321}
      account-name: ${VIETQR_ACCOUNT_NAME:MYSHOP BOUTIQUE}
  order:
    unpaid-expiration-hours: ${ORDER_UNPAID_EXPIRATION_HOURS:24}
    auto-cancel-interval-ms: ${ORDER_AUTO_CANCEL_INTERVAL_MS:900000}

