openapi: 3.0.3

# Source of truth for the myshop REST API (contract-first, PLAN.md §8).
# ✅ = implemented today. Endpoints marked "Phase 1/2" are specified but not
# built yet — implement them exactly as written here; change the spec first.

info:
  title: myshop API
  version: 1.0.0
  description: |
    E-commerce REST API for the myshop storefront.

    Conventions:
    - All money values are **integer cents** (`priceCents: 1900` = $19.00). Never floats.
    - All list endpoints use the shared pagination envelope
      `{ content, page, size, totalElements, totalPages }`.
    - All errors are RFC 9457 problem+json with `code` (stable machine code)
      and `traceId` (quote in bug reports).
    - Status codes: 400 validation · 401 unauthenticated · 403 forbidden ·
      404 missing · 409 conflict (e.g. out of stock) · 422 business rule · 500 unexpected.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Products
  - name: Categories
  - name: Cart
  - name: Checkout
  - name: Webhooks
  - name: Auth
  - name: Admin
  - name: Blog

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe ✅
      security: []
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP

  /api/v1/products:
    get:
      tags: [Products]
      summary: List active products ✅
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
      responses:
        '200':
          description: Paged product summaries, prices aggregated from variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedProducts' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/products/{slug}:
    get:
      tags: [Products]
      summary: Product detail with variants and images ✅
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404':
          description: No ACTIVE product with this slug
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                code: PRODUCT_NOT_FOUND
                detail: No product with slug 'xyz'

  /api/v1/products/{slug}/recommendations:
    get:
      tags: [Products]
      summary: Related products for an upsell surface ✅
      description: |
        Backs every recommendation surface so strategy changes never touch the UI.
        Curated order from the related_products mapping; limit applies after
        ordering. Unknown slug → 404 PRODUCT_NOT_FOUND; unknown type → 400.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [CROSS_SELL, UPSELL, BUNDLE]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 10, default: 3 }
      responses:
        '200':
          description: Curated recommendations (empty list is valid)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Category list ✅
      security: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /api/v1/categories/{slug}/products:
    get:
      tags: [Categories]
      summary: Products in a category ✅
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
      responses:
        '200':
          description: Paged product summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedProducts' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Current cart ✅
      description: |
        Resolves the cart by `cart_token` cookie (httpOnly, SameSite=Lax, 30 days).
        First call creates an empty cart and sets the cookie. Totals are always
        recalculated server-side from current DB prices.
      responses:
        '200':
          description: The caller's cart (created empty on first call)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add a variant to the cart ✅
      description: Adding an existing variant merges quantities. Server checks stock.
      responses:
        '201':
          description: Item added; returns the updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Out of stock / insufficient stock
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { code: OUT_OF_STOCK }
        '422': { $ref: '#/components/responses/BusinessRule' }
        '404': { $ref: '#/components/responses/NotFound' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, qty]
              properties:
                variantId: { type: string, format: uuid }
                qty: { type: integer, minimum: 1, maximum: 99 }

  /api/v1/cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Change item quantity ✅
      description: Items are always scoped to the caller's cart — a foreign itemId is 404 CART_ITEM_NOT_FOUND.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 0, maximum: 99 }
                description: '0 removes the item'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      summary: Remove an item ✅
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /api/v1/cart/coupon:
    post:
      tags: [Cart]
      summary: Apply a coupon code ✅
      description: |
        Case-insensitive code. Active + unexpired coupon only; min-order checked
        against the server-computed subtotal. PERCENT floors to whole minor units,
        FIXED clamps to the subtotal (total never negative). Applied coupon that
        later expires/vanishes silently drops from the cart response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: WELCOME10 }
      responses:
        '200':
          description: Updated cart with discount applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: Unknown / inactive / expired code (or no cart cookie)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { code: COUPON_NOT_FOUND }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [Cart]
      summary: Remove the applied coupon ✅
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /api/v1/checkout:
    post:
      tags: [Checkout]
      summary: Place order and start checkout (COD, VietQR, or Stripe)
      description: |
        The server recalculates prices, discounts and shipping from the database —
        client-supplied numbers are never trusted. Idempotent per Idempotency-Key.
        Supports COD, VietQR bank transfer, and Stripe.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
          description: Retrying with the same key never creates a duplicate order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /api/v1/orders/{id}:
    get:
      tags: [Checkout, Orders]
      summary: Get order details by ID or order code
      description: Public lookup for order confirmation receipt and tracking.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/webhooks/stripe:
    post:
      tags: [Webhooks]
      summary: Stripe events (Phase 1)
      description: Signature-verified. Order status transitions are driven ONLY by these events.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event envelope
      responses:
        '204': { description: Accepted (must be retry-safe and idempotent) }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register ✅
      description: |
        Also issues tokens (like login) and adopts the caller's guest cart:
        it becomes the account cart, or merges into it (quantities clamped to stock).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201': { $ref: '#/components/responses/AuthTokens' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login ✅
      description: Guest cart adoption/merge applies here too.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate tokens ✅
      description: |
        Reads the httpOnly `refresh_token` cookie (scoped to /api/v1/auth) and
        sets a fresh one. Stateless — a refresh token stays valid until expiry.
      security: []
      responses:
        '200': { $ref: '#/components/responses/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out ✅
      description: Clears the refresh cookie with a 204.
      security: []
      responses:
        '204': { description: Refresh cookie cleared }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user from the Bearer token ✅
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile from token claims (no DB hit)
          content:
            application/json:
              schema:
                type: object
                required: [email, name, role]
                properties:
                  email: { type: string }
                  name: { type: string }
                  role: { type: string, example: CUSTOMER }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/products:
    get:
      tags: [Admin]
      summary: List all products (any status) ✅
      description: Requires an ADMIN Bearer token (403 otherwise). Includes DRAFT and ARCHIVED.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: q, schema: { type: string }, description: 'Case-insensitive contains on name or slug' }
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paged admin summaries (primary image, variant count, stock, price range)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedAdminProducts' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Admin]
      summary: Create a product ✅
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, categoryId, status]
              properties:
                name: { type: string, maxLength: 255 }
                slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 255 }
                description: { type: string, default: '' }
                shortDescription: { type: string, maxLength: 200 }
                status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
                categoryId: { type: string, format: uuid }
      responses:
        '201':
          description: Created — full product with (empty) variant list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '409': { description: SLUG_TAKEN }
        '404': { description: CATEGORY_NOT_FOUND (unknown categoryId) }

  /api/v1/admin/products/{id}:
    get:
      tags: [Admin]
      summary: Product detail with variants and images ✅
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Any status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Update product fields ✅
      description: |
        Partial update — absent fields stay unchanged. The slug is immutable
(stable-URL rule); change status here (e.g. DRAFT → ACTIVE to publish).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string }
                shortDescription: { type: string, maxLength: 200 }
                status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
                categoryId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/products/{id}/variants:
    post:
      tags: [Admin]
      summary: Add a variant ✅
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, priceCents, stock]
              properties:
                sku: { type: string, pattern: '^[A-Za-z0-9-]+$', maxLength: 64 }
                priceCents: { type: integer, format: int64, minimum: 0 }
                compareAtPriceCents: { type: integer, format: int64, minimum: 0 }
                stock: { type: integer, minimum: 0 }
                attributes: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Variant added — returns the updated product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SKU_TAKEN }

  /api/v1/admin/variants/{variantId}:
    patch:
      tags: [Admin]
      summary: Update variant (sku, price, compareAt, stock, attributes) ✅
      description: Partial — absent fields stay unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: variantId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku: { type: string, pattern: '^[A-Za-z0-9-]+$' }
                priceCents: { type: integer, format: int64, minimum: 0 }
                compareAtPriceCents: { type: integer, format: int64, minimum: 0, nullable: true }
                stock: { type: integer, minimum: 0 }
                attributes: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Delete a variant ✅ (ADR 0005)
      description: |
        409 VARIANT_IN_USE when the variant is referenced by a cart item
        (cart_items FK is RESTRICT). Carts expire on their own; retry later.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: variantId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: VARIANT_IN_USE }

  /api/v1/admin/products/{id}/images:
    post:
      tags: [Admin]
      summary: Add an image by URL ✅
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 1024 }
                alt: { type: string, maxLength: 255, default: '' }
      responses:
        '201':
          description: Image added — returns the updated product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/products/{id}/images/upload:
    post:
      tags: [Admin]
      summary: Upload an image file ✅ (ADR 0005)
      description: |
        multipart/form-data with `file` (+ optional `alt`). jpg/png/webp only,
        ≤ 5 MB. Stored in the API's upload dir and served from
        /api/v1/files/{name}; the product_images row gets that URL.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt: { type: string }
      responses:
        '201':
          description: Uploaded + attached — returns the updated product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/products/{id}/images/order:
    put:
      tags: [Admin]
      summary: Reorder images ✅
      description: Full ordered id list; positions are reassigned 0..n. Position 0 = primary.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds]
              properties:
                imageIds:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
      responses:
        '200':
          description: Reordered — returns the updated product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'IMAGE_SET_MISMATCH — ids do not match the product exactly' }

  /api/v1/admin/products/{id}/images/{imageId}:
    patch:
      tags: [Admin]
      summary: Update image (url, alt) ✅
      description: Update image URL or alt text while preserving position and id.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: imageId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, maxLength: 2048 }
                alt: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Updated — returns the updated product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Delete an image ✅
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: imageId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/products/{id}/images/{imageId}/upload:
    post:
      tags: [Admin]
      summary: Replace image with an uploaded file ✅
      description: |
        multipart/form-data with `file` (+ optional `alt`). Replaces the file URL
        and optional alt of an existing image while preserving its position and id.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: imageId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt: { type: string }
      responses:
        '200':
          description: Image replaced — returns updated product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/files/{name}:
    get:
      tags: [Admin]
      summary: Serve an uploaded file ✅ (ADR 0005)
      description: Public, immutable-cached. Only names this API generated (UUID.ext) resolve.
      security: []
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        '200': { description: File bytes (image/jpeg | image/png | image/webp) }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/categories:
    get:
      tags: [Admin]
      summary: List categories with ids ✅
      description: Category options for the product form — the public list has no ids.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ordered by position
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, slug, name, hasParent]
                  properties:
                    id: { type: string, format: uuid }
                    slug: { type: string }
                    name: { type: string }
                    hasParent: { type: boolean }
