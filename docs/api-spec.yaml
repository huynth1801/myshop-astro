components:
  parameters:
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string }
      description: Stable forever — changes require a redirect (AGENTS.md)

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token, 15 min. Refresh via the httpOnly refresh_token cookie."

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: VALIDATION_ERROR }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or expired credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not an ADMIN
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict (e.g. out of stock)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: OUT_OF_STOCK }
    BusinessRule:
      description: Valid request, but a business rule rejected it
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: COUPON_MIN_ORDER_NOT_MET }
    AuthTokens:
      description: Access token + refresh cookie set
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, expiresIn]
            properties:
              accessToken: { type: string }
              expiresIn: { type: integer, example: 900 }

  schemas:
    Problem:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          description: Stable machine-readable code
          example: PRODUCT_NOT_FOUND
        detail:
          type: string
          description: Human-readable message
        traceId:
          type: string
          description: Quote this when reporting errors
        status: { type: integer }
        instance: { type: string }

    Image:
      type: object
      required: [url, alt, position]
      properties:
        url: { type: string, format: uri }
        alt: { type: string }
        position: { type: integer }

    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }

    Variant:
      type: object
      required: [id, sku, priceCents, stock, attributes]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        priceCents: { type: integer, description: 'Cents. 1900 = $19.00' }
        compareAtPriceCents:
          type: integer
          nullable: true
        stock: { type: integer }
        attributes:
          type: object
          additionalProperties: true
          example: { size: M }

    ProductSummary:
      type: object
      required: [id, slug, name, category, inStock, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        shortDescription:
          type: string
          nullable: true
        priceFromCents:
          type: integer
          nullable: true
          description: Lowest variant price; null when the product has no variants
        compareAtFromCents:
          type: integer
          nullable: true
          description: Lowest compare-at price — powers −% badges (ADR 0003: VND minor units)
        image:
          allOf: [{ $ref: '#/components/schemas/Image' }]
          nullable: true
        hoverImage:
          allOf: [{ $ref: '#/components/schemas/Image' }]
          nullable: true
          description: Second image for hover swap on cards
        category: { $ref: '#/components/schemas/CategoryRef' }
        defaultVariantId:
          type: string
          format: uuid
          nullable: true
          description: First in-stock variant by SKU — the quick-add target
        inStock: { type: boolean }
        createdAt: { type: string, format: date-time }

    ProductDetail:
      type: object
      required: [id, slug, name, description, category, images, variants, inStock]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        shortDescription:
          type: string
          nullable: true
        category: { $ref: '#/components/schemas/CategoryRef' }
        images:
          type: array
          items: { $ref: '#/components/schemas/Image' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        inStock: { type: boolean }

    PagedProducts:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer, example: 0 }
        size: { type: integer, example: 12 }
        totalElements: { type: integer, example: 342 }
        totalPages: { type: integer, example: 29 }

    PagedAdminProducts:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminProduct' }
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, example: 29 }
        totalPages: { type: integer, example: 2 }

    AdminProduct:
      type: object
      required: [id, slug, name, status, category, variantCount, totalStock, inStock, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        category: { $ref: '#/components/schemas/CategoryRef' }
        priceFromCents: { type: integer, format: int64, nullable: true }
        priceToCents: { type: integer, format: int64, nullable: true }
        variantCount: { type: integer }
        totalStock: { type: integer }
        inStock: { type: boolean }
        image: { $ref: '#/components/schemas/Image', description: Primary image (position 0), null when none }
        createdAt: { type: string, format: date-time }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }

    AdminProductDetail:
      type: object
      required: [id, slug, name, description, shortDescription, status, category, variants, images, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, description: Immutable }
        name: { type: string }
        description: { type: string }
        shortDescription: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        category: { $ref: '#/components/schemas/CategoryRef' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        images:
          type: array
          description: Ordered by position; index 0 is the primary/hero image
          items:
            type: object
            required: [id, url, alt, position]
            properties:
              id: { type: string, format: uuid }
              url: { type: string }
              alt: { type: string }
              position: { type: integer }
        createdAt: { type: string, format: date-time }

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryRef'
        - type: object
          properties:
            parentId:
              type: string
              format: uuid
              nullable: true
            position: { type: integer }

    CartItem:
      type: object
      required: [id, variantId, sku, productName, qty, priceAtAddCents, priceCents, lineTotalCents]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        productSlug: { type: string }
        qty: { type: integer }
        priceAtAddCents: { type: integer }
        priceCents:
          type: integer
          description: Current price — display only; totals are always recalculated server-side
        lineTotalCents: { type: integer }

    Cart:
      type: object
      required: [id, items, subtotalCents, itemCount]
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotalCents: { type: integer }
        discountCents: { type: integer }
        couponCode:
          type: string
          nullable: true
        shippingCents: { type: integer }
        freeShippingThresholdCents:
          type: integer
          description: Powers the free-shipping progress bar (PLAN.md §9)
        itemCount: { type: integer }

    Address:
      type: object
      required: [fullName, line1, city, postalCode, countryCode]
      properties:
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        postalCode: { type: string }
        countryCode: { type: string, minLength: 2, maxLength: 2 }

    PostSummary:
      type: object
      required: [id, title, slug, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string, nullable: true }
        featuredImage: { type: string, nullable: true }
        author: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PostDetail:
      type: object
      required: [id, title, slug, content, status, viewCount, createdAt, relatedProducts]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string, nullable: true }
        content: { type: string }
        featuredImage: { type: string, nullable: true }
        author: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        viewCount: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        relatedProducts:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }

    PagedPosts:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PostSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    AdminPostSummary:
      $ref: '#/components/schemas/PostSummary'

    AdminPostDetail:
      type: object
      required: [id, title, slug, content, status, viewCount, createdAt, relatedProductIds]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        summary: { type: string, nullable: true }
        content: { type: string }
        featuredImage: { type: string, nullable: true }
        author: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        seoTitle: { type: string, nullable: true }
        seoDescription: { type: string, nullable: true }
        viewCount: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        relatedProductIds:
          type: array
          items: { type: string, format: uuid }

    AdminPagedPosts:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminPostSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    AdminCreatePostRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 500 }
        content: { type: string }
        featuredImage: { type: string, maxLength: 2048 }
        author: { type: string, maxLength: 100 }
        status: { type: string, enum: [DRAFT, PUBLISHED], default: DRAFT }
        seoTitle: { type: string, maxLength: 255 }
        seoDescription: { type: string, maxLength: 500 }
        relatedProductIds:
          type: array
          items: { type: string, format: uuid }

    AdminUpdatePostRequest:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 500 }
        content: { type: string }
        featuredImage: { type: string, maxLength: 2048 }
        author: { type: string, maxLength: 100 }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        seoTitle: { type: string, maxLength: 255 }
        seoDescription: { type: string, maxLength: 500 }
        relatedProductIds:
          type: array
          items: { type: string, format: uuid }

    CrawlPostRequest:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl: { type: string, format: uri }

    CrawledPostPreview:
      type: object
      required: [title, content, sourceUrl, suggestedSlug]
      properties:
        title: { type: string }
        summary: { type: string, nullable: true }
        content: { type: string }
        featuredImage: { type: string, nullable: true }
        author: { type: string, nullable: true }
        sourceUrl: { type: string }
        suggestedSlug: { type: string }

    RssSourceResponse:
      type: object
      required: [id, name, url, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        category: { type: string, nullable: true }
        isActive: { type: boolean }
        lastFetchedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PagedRssSources:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RssSourceResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    CreateRssSourceRequest:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 255 }
        url: { type: string, maxLength: 2048 }
        category: { type: string, maxLength: 100 }
        isActive: { type: boolean, default: true }

    RssScanResultResponse:
      type: object
      required: [sourcesScanned, articlesScanned, newDraftsCreated, skippedExisting, createdPosts]
      properties:
        sourcesScanned: { type: integer }
        articlesScanned: { type: integer }
        newDraftsCreated: { type: integer }
        skippedExisting: { type: integer }
        createdPosts:
          type: array
          items: { $ref: '#/components/schemas/AdminPostSummary' }

    BulkDeletePostsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1

    BulkUpdatePostStatusRequest:
      type: object
      required: [ids, status]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        status:
          type: string
          enum: [DRAFT, PUBLISHED]

    BulkOperationResult:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    CustomerAddress:
      type: object
      required: [fullName, phone, line1, city]
      properties:
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        line1: { type: string }
        city: { type: string }
        district: { type: string, nullable: true }
        ward: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        countryCode: { type: string, default: 'VN' }

    CheckoutRequest:
      type: object
      required: [shippingAddress, paymentMethod]
      properties:
        cartToken: { type: string, description: Optional if passed via cookie }
        email: { type: string, format: email, nullable: true }
        phone: { type: string }
        shippingAddress: { $ref: '#/components/schemas/CustomerAddress' }
        paymentMethod:
          type: string
          enum: [COD, VIETQR, STRIPE]
          default: COD
        customerNote: { type: string, nullable: true }

    BankInfo:
      type: object
      required: [bankName, bankAccount, accountHolder, transferContent, amountVnd]
      properties:
        bankName: { type: string }
        bankAccount: { type: string }
        accountHolder: { type: string }
        transferContent: { type: string }
        amountVnd: { type: integer }

    CheckoutResponse:
      type: object
      required: [orderId, orderCode, status, subtotalCents, discountCents, shippingCents, totalCents, paymentMethod]
      properties:
        orderId: { type: string, format: uuid }
        orderCode: { type: string }
        status: { type: string }
        subtotalCents: { type: integer, format: int64 }
        discountCents: { type: integer, format: int64 }
        shippingCents: { type: integer, format: int64 }
        totalCents: { type: integer, format: int64 }
        paymentMethod: { type: string, enum: [COD, VIETQR, STRIPE] }
        vietQrUrl: { type: string, nullable: true }
        bankInfo: { $ref: '#/components/schemas/BankInfo', nullable: true }
        stripeUrl: { type: string, nullable: true }

    OrderItemResponse:
      type: object
      required: [id, productName, sku, unitPriceCents, qty, totalPriceCents]
      properties:
        id: { type: string, format: uuid }
        productName: { type: string }
        sku: { type: string }
        unitPriceCents: { type: integer, format: int64 }
        qty: { type: integer }
        totalPriceCents: { type: integer, format: int64 }
        imageUrl: { type: string, nullable: true }

    OrderDetailResponse:
      type: object
      required: [id, orderCode, status, subtotalCents, discountCents, shippingCents, totalCents, paymentMethod, shippingAddress, items, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderCode: { type: string }
        status: { type: string }
        subtotalCents: { type: integer, format: int64 }
        discountCents: { type: integer, format: int64 }
        shippingCents: { type: integer, format: int64 }
        totalCents: { type: integer, format: int64 }
        paymentMethod: { type: string }
        shippingAddress: { $ref: '#/components/schemas/CustomerAddress' }
        customerNote: { type: string, nullable: true }
        vietQrUrl: { type: string, nullable: true }
        bankInfo: { $ref: '#/components/schemas/BankInfo', nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }
        createdAt: { type: string, format: date-time }

    AdminOrderSummary:
      type: object
      required: [id, orderCode, status, customerName, customerPhone, totalCents, itemCount, paymentMethod, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderCode: { type: string }
        status: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        customerCity: { type: string, nullable: true }
        totalCents: { type: integer, format: int64 }
        itemCount: { type: integer }
        paymentMethod: { type: string }
        createdAt: { type: string, format: date-time }

    PagedAdminOrders:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminOrderSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    AdminOrderMetrics:
      type: object
      required: [totalOrders, pendingCount, confirmedCount, shippingCount, fulfilledCount, cancelledCount, totalRevenueCents]
      properties:
        totalOrders: { type: integer }
        pendingCount: { type: integer }
        confirmedCount: { type: integer }
        shippingCount: { type: integer }
        fulfilledCount: { type: integer }
        cancelledCount: { type: integer }
        totalRevenueCents: { type: integer, format: int64 }

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, PAID, SHIPPING, FULFILLED, CANCELLED]

